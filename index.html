<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DelayMirror">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#000000">
<title>Delay Mirror — 遅延再生カメラ</title>
<style>
  :root {
    --bg: #0a0a0b;
    --panel: rgba(20, 20, 22, 0.85);
    --text: #f5f5f7;
    --dim: #8a8a90;
    --accent: #ff3b30;
    --accent-2: #30d158;
    --border: rgba(255,255,255,0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Helvetica Neue', 'Hiragino Sans', system-ui, sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
  }

  /* ── 縦画面レイアウト ── */
  body {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
  }
  .header {
    padding: 12px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    order: 0;
  }
  .video-stage {
    flex: 1;
    min-height: 0;
    position: relative;
    background: #000;
    overflow: hidden;
    order: 1;
  }
  .controls {
    background: var(--panel);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid var(--border);
    padding: 20px;
    flex-shrink: 0;
    order: 2;
  }

  /* ── 横画面レイアウト（CSS Grid / iPhone対応）── */
  @media (orientation: landscape) and (max-height: 520px) {
    body {
      display: grid;
      grid-template-columns: 1fr 200px;
      grid-template-rows: auto 1fr;
      /* flex 関連プロパティをリセット */
      flex-direction: unset;
    }
    .header {
      grid-column: 1 / 3;
      grid-row: 1;
      padding: 6px 16px;
      order: unset;
    }
    .video-stage {
      grid-column: 1;
      grid-row: 2;
      order: unset;
      min-height: 0;
      height: auto;
    }
    .controls {
      grid-column: 2;
      grid-row: 2;
      order: unset;
      height: auto;
      width: auto;
      flex-shrink: unset;
      border-top: none;
      border-left: 1px solid var(--border);
      padding: 12px 14px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .delay-control  { margin-bottom: 8px; }
    .delay-label    { margin-bottom: 6px; }
    .delay-value    { font-size: 20px; }
    .toggle-row     { padding: 5px 0; margin-bottom: 8px; }
    .btn            { padding: 9px 6px; font-size: 12px; }
  }

  /* ── 共通コンポーネント ── */
  .title {
    font-size: 13px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-weight: 600;
  }
  .title span { color: var(--accent); }
  .status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    color: var(--dim);
    letter-spacing: 0.1em;
  }
  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--dim);
    transition: background 0.3s;
  }
  .status-dot.live {
    background: var(--accent-2);
    box-shadow: 0 0 12px var(--accent-2);
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  #playback {
    width: 100%; height: 100%;
    display: block;
    background: #000;
  }
  #liveVideo {
    position: absolute;
    width: 1px; height: 1px;
    opacity: 0;
    pointer-events: none;
  }

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(180deg,rgba(0,0,0,.6),rgba(0,0,0,.9));
    text-align: center;
    padding: 40px 24px;
    z-index: 10;
    transition: opacity .4s;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .overlay-icon { font-size: 56px; margin-bottom: 24px; }
  .overlay h1 { font-size: 28px; font-weight: 700; margin-bottom: 12px; }
  .overlay p  { font-size: 14px; color: var(--dim); line-height: 1.7; max-width: 320px; margin-bottom: 32px; }
  .start-btn {
    background: var(--accent); color: white; border: none;
    padding: 16px 40px; border-radius: 100px;
    font-size: 15px; font-weight: 600; cursor: pointer;
    box-shadow: 0 8px 32px rgba(255,59,48,.4);
  }
  .start-btn:active { transform: scale(.96); }
  .error-msg { color: var(--accent); font-size: 13px; margin-top: 16px; max-width: 320px; line-height: 1.5; }

  .delay-badge {
    position: absolute; top: 16px; left: 16px;
    background: rgba(0,0,0,.6);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    padding: 8px 14px; border-radius: 100px;
    font-size: 12px; font-weight: 600; letter-spacing: .08em;
    display: flex; align-items: center; gap: 6px; z-index: 5;
  }
  .delay-badge::before {
    content: ''; width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent); animation: pulse 1.5s infinite;
  }
  .buffer-indicator {
    position: absolute; top: 16px; right: 16px;
    background: rgba(0,0,0,.6);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    padding: 8px 14px; border-radius: 100px;
    font-size: 11px; letter-spacing: .05em; z-index: 5; color: var(--dim);
  }
  .buffer-indicator strong { color: var(--text); font-variant-numeric: tabular-nums; }

  /* ── UI非表示モード ── */
  body.ui-hidden .header,
  body.ui-hidden .controls { display: none; }
  body.ui-hidden .video-stage { position: fixed; inset: 0; z-index: 50; }

  /* 全画面中にタップで戻れることを示すヒント */
  body.ui-hidden #tapHint {
    display: flex;
    opacity: 1;
    animation: fadeHint 3s ease forwards;
  }
  @keyframes fadeHint { 0%{opacity:1} 60%{opacity:1} 100%{opacity:0} }
  #tapHint {
    display: none;
    position: absolute;
    bottom: max(20px, env(safe-area-inset-bottom, 0px));
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,.55);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    color: var(--dim);
    padding: 6px 16px;
    border-radius: 100px;
    font-size: 11px;
    letter-spacing: .06em;
    pointer-events: none;
    z-index: 6;
    white-space: nowrap;
  }

  .delay-control { margin-bottom: 16px; }
  .delay-label {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 10px;
  }
  .delay-label span:first-child {
    font-size: 11px; letter-spacing: .15em; text-transform: uppercase; color: var(--dim);
  }
  .delay-value {
    font-size: 24px; font-weight: 700;
    font-variant-numeric: tabular-nums; letter-spacing: -.02em;
  }
  .delay-value small { font-size: 13px; color: var(--dim); font-weight: 400; margin-left: 2px; }

  input[type="range"] {
    width: 100%; -webkit-appearance: none; appearance: none;
    height: 4px; background: rgba(255,255,255,.1); border-radius: 2px; outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 22px; height: 22px;
    background: var(--text); border-radius: 50%; cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,.4);
  }
  input[type="range"]::-moz-range-thumb {
    width: 22px; height: 22px; background: var(--text); border-radius: 50%;
    cursor: pointer; border: none; box-shadow: 0 2px 8px rgba(0,0,0,.4);
  }

  .button-row { display: flex; gap: 10px; }
  .btn {
    flex: 1; background: rgba(255,255,255,.08); color: var(--text);
    border: 1px solid var(--border); padding: 12px; border-radius: 12px;
    font-size: 13px; font-weight: 500; letter-spacing: .03em;
    cursor: pointer; transition: all .15s; font-family: inherit;
  }
  .btn:active { transform: scale(.97); background: rgba(255,255,255,.14); }
  .btn.primary { background: var(--accent); border-color: var(--accent); }
  .btn.primary:active { background: #d62e24; }

  .toggle-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 0; margin-bottom: 12px; font-size: 13px;
  }
  .toggle-row span { color: var(--dim); letter-spacing: .03em; }
  .switch {
    position: relative; width: 44px; height: 26px;
    background: rgba(255,255,255,.1); border-radius: 13px; cursor: pointer; transition: background .2s;
  }
  .switch.on { background: var(--accent-2); }
  .switch::after {
    content: ''; position: absolute; top: 2px; left: 2px;
    width: 22px; height: 22px; background: white; border-radius: 50%; transition: transform .2s;
  }
  .switch.on::after { transform: translateX(18px); }
</style>
</head>
<body>
<div class="header">
  <div class="title">DELAY <span>MIRROR</span></div>
  <div class="status">
    <span id="statusText">待機中</span>
    <div class="status-dot" id="statusDot"></div>
  </div>
</div>

<div class="video-stage">
  <video id="liveVideo" autoplay playsinline muted></video>
  <canvas id="playback"></canvas>
  <div class="delay-badge" id="delayBadge" style="display:none;">
    <span id="delayBadgeText">10s 遅延</span>
  </div>
  <div class="buffer-indicator" id="bufferIndicator" style="display:none;">
    バッファ <strong id="bufferText">0.0s</strong>
  </div>
  <div id="tapHint">タップしてコントロールを表示</div>
  <div class="overlay" id="overlay">
    <div class="overlay-icon">🪞</div>
    <h1>遅延ミラー</h1>
    <p>カメラの映像を指定した秒数だけ遅らせて再生します。ダンスやフォームのチェックに。</p>
    <button class="start-btn" id="startBtn">カメラを開始</button>
    <div class="error-msg" id="errorMsg"></div>
  </div>
</div>

<div class="controls">
  <div class="delay-control">
    <div class="delay-label">
      <span>遅延時間</span>
      <div class="delay-value"><span id="delayDisplay">10</span><small>秒</small></div>
    </div>
    <input type="range" id="delaySlider" min="2" max="30" step="1" value="10">
  </div>
  <div class="toggle-row">
    <span>ミラー反転（自分視点）</span>
    <div class="switch on" id="mirrorToggle"></div>
  </div>
  <div class="button-row">
    <button class="btn" id="cameraSwitchBtn">📷 切替</button>
    <button class="btn" id="rotateBtn">🔄 回転</button>
    <button class="btn" id="fullscreenBtn" style="display:none;">
      <svg id="fsIcon" xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="pointer-events:none">
        <polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/>
        <line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/>
      </svg>
    </button>
    <button class="btn primary" id="stopBtn" style="display:none;">停止</button>
  </div>
</div>

<script>
  const liveVideo       = document.getElementById('liveVideo');
  const canvas          = document.getElementById('playback');
  const ctx             = canvas.getContext('2d');
  const startBtn        = document.getElementById('startBtn');
  const stopBtn         = document.getElementById('stopBtn');
  const overlay         = document.getElementById('overlay');
  const errorMsg        = document.getElementById('errorMsg');
  const delaySlider     = document.getElementById('delaySlider');
  const delayDisplay    = document.getElementById('delayDisplay');
  const delayBadge      = document.getElementById('delayBadge');
  const delayBadgeText  = document.getElementById('delayBadgeText');
  const bufferIndicator = document.getElementById('bufferIndicator');
  const bufferText      = document.getElementById('bufferText');
  const statusText      = document.getElementById('statusText');
  const statusDot       = document.getElementById('statusDot');
  const mirrorToggle    = document.getElementById('mirrorToggle');
  const cameraSwitchBtn = document.getElementById('cameraSwitchBtn');
  const rotateBtn       = document.getElementById('rotateBtn');
  const fullscreenBtn   = document.getElementById('fullscreenBtn');
  const fsIcon          = document.getElementById('fsIcon');
  const tapHint         = document.getElementById('tapHint');

  // 非表示のキャプチャ用キャンバス
  const capCanvas = document.createElement('canvas');
  const capCtx    = capCanvas.getContext('2d');

  let stream = null;
  let captureInterval = null;
  let rafId = null;
  let frameBuffer = []; // [{t: ms, img: HTMLImageElement}]
  let delaySeconds = 10;
  let isRunning = false;
  let mirrored = true;
  let currentFacingMode = 'user';
  let rotationDeg = 0; // 手動回転: 0 / 90 / 180 / 270
  let isUIHidden  = false;

  const SVG_EXPAND = `<polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/>`;
  const SVG_COLLAPSE = `<polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/><line x1="10" y1="14" x2="3" y2="21"/><line x1="21" y1="3" x2="14" y2="10"/>`;

  function toggleUI() {
    isUIHidden = !isUIHidden;
    document.body.classList.toggle('ui-hidden', isUIHidden);
    fsIcon.innerHTML = isUIHidden ? SVG_COLLAPSE : SVG_EXPAND;
    if (isUIHidden) {
      // アニメーション再実行のため一旦リセット
      tapHint.style.animation = 'none';
      tapHint.offsetHeight; // reflow
      tapHint.style.animation = '';
    }
    requestAnimationFrame(resizeCanvas);
  }
  fullscreenBtn.addEventListener('click', toggleUI);

  // 全画面中に映像タップでコントロールを戻す
  canvas.addEventListener('click', () => {
    if (isUIHidden) toggleUI();
  });

  const CAPTURE_INTERVAL = 80; // ~12fps

  // ── キャンバスサイズをコンテナに合わせる ──
  function resizeCanvas() {
    canvas.width  = canvas.offsetWidth  || canvas.clientWidth  || 1;
    canvas.height = canvas.offsetHeight || canvas.clientHeight || 1;
  }
  window.addEventListener('resize', resizeCanvas);

  // ── 遅延スライダー ──
  delaySlider.addEventListener('input', (e) => {
    delaySeconds = parseInt(e.target.value);
    delayDisplay.textContent = delaySeconds;
    delayBadgeText.textContent = `${delaySeconds}s 遅延`;
  });

  // ── ミラー切替 ──
  mirrorToggle.addEventListener('click', () => {
    mirrored = !mirrored;
    mirrorToggle.classList.toggle('on', mirrored);
  });

  // ── 回転ボタン（上下逆などを手動補正）──
  rotateBtn.addEventListener('click', () => {
    rotationDeg = (rotationDeg + 90) % 360;
    rotateBtn.textContent = rotationDeg === 0 ? '🔄 回転' : `🔄 ${rotationDeg}°`;
  });

  // ── カメラ切替 ──
  cameraSwitchBtn.addEventListener('click', async () => {
    if (!isRunning) return;
    currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';
    stopCapture();
    await startCamera();
  });

  startBtn.addEventListener('click', startCamera);

  stopBtn.addEventListener('click', () => {
    stopCapture();
    // UI非表示モードを解除してから停止
    if (isUIHidden) { isUIHidden = false; document.body.classList.remove('ui-hidden'); fsIcon.innerHTML = SVG_EXPAND; }
    overlay.classList.remove('hidden');
    stopBtn.style.display = 'none';
    delayBadge.style.display = 'none';
    bufferIndicator.style.display = 'none';
    fullscreenBtn.style.display = 'none';
    statusText.textContent = '待機中';
    statusDot.classList.remove('live');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  });

  // ── カメラ起動 ──
  async function startCamera() {
    errorMsg.textContent = '';
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: currentFacingMode, width: {ideal:1280}, height: {ideal:720} },
        audio: false
      });
      liveVideo.srcObject = stream;
      await liveVideo.play();

      frameBuffer = [];
      resizeCanvas();

      captureInterval = setInterval(captureFrame, CAPTURE_INTERVAL);
      rafId = requestAnimationFrame(drawLoop);

      overlay.classList.add('hidden');
      stopBtn.style.display = 'block';
      delayBadge.style.display = 'flex';
      bufferIndicator.style.display = 'block';
      fullscreenBtn.style.display = 'flex';
      delayBadgeText.textContent = `${delaySeconds}s 遅延`;
      statusText.textContent = '撮影中';
      statusDot.classList.add('live');
      isRunning = true;
    } catch (err) {
      let msg = 'カメラを起動できませんでした。';
      if      (err.name === 'NotAllowedError') msg = 'カメラへのアクセスが拒否されました。ブラウザ設定で許可してください。';
      else if (err.name === 'NotFoundError')   msg = 'カメラが見つかりませんでした。';
      else if (err.message)                    msg = err.message;
      errorMsg.textContent = msg;
    }
  }

  // ── フレームキャプチャ ──
  function captureFrame() {
    if (!isRunning) return;
    const vw = liveVideo.videoWidth;
    const vh = liveVideo.videoHeight;
    // videoWidth/videoHeight が確定するまで待つ（iOS では遅れることがある）
    if (!vw || !vh) return;

    // 毎フレームで実際の動画サイズに合わせてキャプチャキャンバスをリサイズ
    // → loadedmetadata 時点ではサイズが未確定なためここで設定する
    const maxDim = 480;
    if (vw >= vh) {
      capCanvas.width  = maxDim;
      capCanvas.height = Math.round(maxDim * vh / vw);
    } else {
      capCanvas.width  = Math.round(maxDim * vw / vh);
      capCanvas.height = maxDim;
    }

    capCtx.drawImage(liveVideo, 0, 0, capCanvas.width, capCanvas.height);

    const jpeg = capCanvas.toDataURL('image/jpeg', 0.65);
    const img = new Image();
    img.src = jpeg;
    frameBuffer.push({ t: Date.now(), img });

    // 古いフレームを破棄（遅延 + 余裕6秒）
    const cutoff = Date.now() - (delaySeconds + 6) * 1000;
    while (frameBuffer.length > 0 && frameBuffer[0].t < cutoff) {
      frameBuffer.shift();
    }
  }

  // ── 描画ループ ──
  function drawLoop() {
    rafId = requestAnimationFrame(drawLoop);
    if (!isRunning || frameBuffer.length === 0) return;

    // 目標時刻（現在 - 遅延秒数）に最も近い過去フレームを取得
    const targetTime = Date.now() - delaySeconds * 1000;
    let frame = frameBuffer[0]; // バッファが溜まるまでは最古フレームを表示
    for (let i = frameBuffer.length - 1; i >= 0; i--) {
      if (frameBuffer[i].t <= targetTime) { frame = frameBuffer[i]; break; }
    }
    if (!frame || !frame.img.complete || !frame.img.naturalWidth) return;

    const cw = canvas.width;
    const ch = canvas.height;
    if (!cw || !ch) return;

    const fw = frame.img.naturalWidth;
    const fh = frame.img.naturalHeight;
    const isRot90 = (rotationDeg === 90 || rotationDeg === 270);

    // 90°/270° 回転時はキャンバスへのフィットで幅・高さが入れ替わる
    const fitW = isRot90 ? fh : fw;
    const fitH = isRot90 ? fw : fh;
    const scale = Math.min(cw / fitW, ch / fitH);

    ctx.clearRect(0, 0, cw, ch);
    ctx.save();
    ctx.translate(cw / 2, ch / 2);
    // ① まず回転（方向補正）、② 次にミラー（左右反転）の順で適用
    if (rotationDeg) ctx.rotate(rotationDeg * Math.PI / 180);
    if (mirrored)    ctx.scale(-1, 1);
    ctx.drawImage(frame.img, -fw * scale / 2, -fh * scale / 2, fw * scale, fh * scale);
    ctx.restore();

    // バッファ秒数を表示
    if (frameBuffer.length > 1) {
      const dur = (frameBuffer[frameBuffer.length - 1].t - frameBuffer[0].t) / 1000;
      bufferText.textContent = dur.toFixed(1) + 's';
    }
  }

  // ── 停止・クリーンアップ ──
  function stopCapture() {
    isRunning = false;
    if (captureInterval) { clearInterval(captureInterval); captureInterval = null; }
    if (rafId)           { cancelAnimationFrame(rafId);    rafId = null; }
    if (stream)          { stream.getTracks().forEach(t => t.stop()); stream = null; }
    liveVideo.srcObject = null;
    frameBuffer = [];
  }

  window.addEventListener('beforeunload', stopCapture);
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js')
        .then((reg) => console.log('SW registered:', reg.scope))
        .catch((err) => console.warn('SW registration failed:', err));
    });
  }
</script>
</body>
</html>
