<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="エコーミラー">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#070B14">
<title>エコーミラー — 10秒前映像</title>
<style>
  :root {
    --bg: #070B14;
    --surface: #101827;
    --surface-2: #172236;
    --text: #EAF1FF;
    --muted: #94A7C4;
    --soft: #4E5F7C;
    --line: rgba(234,241,255,.14);
    --ready: #60A5FA;
    --focus: #22D3EE;
    --danger: #FF5C7A;
    --shadow: 0 -12px 30px rgba(0,0,0,.28);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Helvetica Neue', 'Hiragino Sans', system-ui, sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
  }
  body {
    display: grid;
    grid-template-rows: auto 1fr auto;
    height: 100vh;
    height: 100dvh;
  }
  .header {
    min-height: 48px;
    padding: 9px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--line);
    background: #0A1020;
  }
  .brand { display: flex; flex-direction: column; gap: 2px; }
  .title { font-size: 14px; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; }
  .subtitle { color: var(--muted); font-size: 11px; }
  .status {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    min-height: 30px;
    padding: 0 10px;
    border: 1px solid var(--line);
    border-radius: 999px;
    color: var(--muted);
    background: rgba(255,255,255,.04);
    font-size: 12px;
    white-space: nowrap;
  }
  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--soft);
    transition: background .2s, box-shadow .2s;
  }
  .status-dot.live { background: var(--ready); box-shadow: 0 0 0 4px rgba(96,165,250,.16); }
  .video-stage {
    min-height: 0;
    position: relative;
    overflow: hidden;
    background: #04070E;
  }
  #playback { width: 100%; height: 100%; display: block; background: #04070E; }
  #liveVideo { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 34px 24px;
    z-index: 10;
    text-align: center;
    background: radial-gradient(circle at 50% 35%, rgba(23,34,54,.92), rgba(7,11,20,.98) 60%);
    transition: opacity .25s;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .overlay-icon { font-size: 44px; line-height: 1; }
  .overlay h1 { max-width: 360px; font-size: 30px; line-height: 1.2; font-weight: 800; }
  .overlay p { max-width: 340px; color: var(--muted); font-size: 15px; line-height: 1.7; }
  .start-btn {
    min-width: 220px;
    min-height: 54px;
    border: none;
    border-radius: 8px;
    background: var(--ready);
    color: #06121F;
    font-size: 17px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(96,165,250,.26);
  }
  .start-btn:active, .btn:active, .switch:active { transform: scale(.98); }
  .error-msg { color: #ffb1aa; font-size: 13px; max-width: 340px; line-height: 1.5; }
  .delay-badge, .buffer-indicator, .warmup {
    position: absolute;
    z-index: 5;
    border: 1px solid rgba(255,255,255,.16);
    background: rgba(7,11,20,.80);
    color: var(--muted);
    border-radius: 8px;
    font-size: 12px;
    white-space: nowrap;
  }
  .delay-badge {
    top: 12px; left: 12px;
    padding: 8px 11px;
    display: flex;
    align-items: center;
    gap: 7px;
    font-weight: 700;
  }
  .delay-badge::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--focus); }
  .buffer-indicator { top: 12px; right: 12px; padding: 8px 11px; }
  .buffer-indicator strong, .warmup strong { color: var(--text); font-variant-numeric: tabular-nums; }
  .warmup {
    left: 50%; bottom: 14px;
    transform: translateX(-50%);
    padding: 10px 14px;
    background: rgba(16,24,39,.92);
    color: var(--text);
    font-weight: 700;
  }
  #tapHint {
    display: none;
    position: absolute;
    bottom: max(16px, env(safe-area-inset-bottom, 0px));
    left: 50%;
    transform: translateX(-50%);
    background: rgba(7,11,20,.76);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 12px;
    pointer-events: none;
    z-index: 6;
    white-space: nowrap;
  }
  body.ui-hidden .header, body.ui-hidden .controls { display: none; }
  body.ui-hidden .video-stage { position: fixed; inset: 0; z-index: 50; }
  body.ui-hidden #tapHint { display: flex; animation: fadeHint 3s ease forwards; }
  @keyframes fadeHint { 0%,65%{opacity:1} 100%{opacity:0} }
  .controls {
    background: var(--surface);
    border-top: 1px solid var(--line);
    box-shadow: var(--shadow);
    padding: 12px 14px max(14px, env(safe-area-inset-bottom, 0px));
  }
  .control-grid {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 12px;
    align-items: center;
  }
  .delay-control { min-width: 0; }
  .delay-label {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 8px;
  }
  .delay-label span:first-child { color: var(--muted); font-size: 12px; font-weight: 700; }
  .delay-value { font-size: 30px; font-weight: 850; font-variant-numeric: tabular-nums; }
  .delay-value small { font-size: 14px; color: var(--muted); margin-left: 2px; font-weight: 650; }
  input[type="range"] {
    width: 100%;
    -webkit-appearance: none; appearance: none;
    height: 8px;
    background: linear-gradient(90deg, var(--ready), #CBD5E1);
    border-radius: 999px;
    outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 28px; height: 28px;
    border-radius: 50%;
    background: var(--text);
    border: 3px solid var(--surface);
    box-shadow: 0 2px 8px rgba(0,0,0,.42);
  }
  input[type="range"]::-moz-range-thumb {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: var(--text);
    border: 3px solid var(--surface);
    box-shadow: 0 2px 8px rgba(0,0,0,.42);
  }
  .state-strip {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 10px;
  }
  .state-pill {
    display: inline-flex;
    align-items: center;
    min-height: 28px;
    padding: 0 9px;
    border: 1px solid var(--line);
    border-radius: 999px;
    color: var(--muted);
    background: var(--surface-2);
    font-size: 12px;
    font-weight: 650;
  }
  .button-row {
    display: grid;
    grid-template-columns: repeat(5, 68px);
    gap: 8px;
  }
  .btn {
    min-height: 58px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--surface-2);
    color: var(--text);
    font-family: inherit;
    font-size: 12px;
    font-weight: 750;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }
  .btn .icon { font-size: 18px; line-height: 1; display: flex; align-items: center; justify-content: center; }
  .btn .icon svg { width: 22px; height: 22px; display: block; }
  .btn:disabled { opacity: .45; }
  .btn.danger { background: rgba(255,92,122,.14); border-color: rgba(255,92,122,.45); color: #FFD8DE; }
  .toggle-row { display: none; }
  .switch { display: none; }
  @media (orientation: landscape) and (max-height: 560px) {
    body { grid-template-columns: 1fr 220px; grid-template-rows: auto 1fr; }
    .header { grid-column: 1 / 3; min-height: 40px; padding: 6px 12px; }
    .subtitle { display: none; }
    .video-stage { grid-column: 1; grid-row: 2; }
    .controls { grid-column: 2; grid-row: 2; border-top: none; border-left: 1px solid var(--line); padding: 10px; overflow-y: auto; }
    .control-grid { grid-template-columns: 1fr; align-content: center; min-height: 100%; }
    .button-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .delay-value { font-size: 25px; }
    .btn { min-height: 50px; }
  }
  @media (max-width: 520px) {
    .header { padding: 8px 12px; }
    .title { font-size: 13px; }
    .status { padding: 0 8px; font-size: 11px; }
    .control-grid { grid-template-columns: 1fr; }
    .button-row { grid-template-columns: repeat(5, minmax(0, 1fr)); }
    .btn { min-height: 54px; }
  }
</style>
</head>
<body>
<div class="header">
  <div class="brand">
    <div class="title">エコーミラー</div>
    <div class="subtitle">指定秒数前の自分を確認</div>
  </div>
  <div class="status" aria-live="polite">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText">待機中</span>
  </div>
</div>

<div class="video-stage">
  <video id="liveVideo" autoplay playsinline muted></video>
  <canvas id="playback"></canvas>
  <div class="delay-badge" id="delayBadge" style="display:none;">
    <span id="delayBadgeText">10秒前の映像</span>
  </div>
  <div class="buffer-indicator" id="bufferIndicator" style="display:none;">
    ためた映像 <strong id="bufferText">0.0s</strong>
  </div>
  <div class="warmup" id="warmupText" style="display:none;">
    あと <strong>10.0s</strong>
  </div>
  <div id="tapHint">タップで操作を表示</div>
  <div class="overlay" id="overlay">
    <div class="overlay-icon">●</div>
    <h1>10秒前の自分を見る</h1>
    <p>動いた直後に画面を見るだけで、フォームや姿勢をその場で確認できます。</p>
    <button class="start-btn" id="startBtn">カメラを開始</button>
    <div class="error-msg" id="errorMsg"></div>
  </div>
</div>

<div class="controls">
  <div class="control-grid">
    <div class="delay-control">
      <div class="delay-label">
        <span>遅延時間</span>
        <div class="delay-value"><span id="delayDisplay">10</span><small>秒前</small></div>
      </div>
      <input type="range" id="delaySlider" min="2" max="30" step="1" value="10" aria-label="遅延時間">
      <div class="state-strip">
        <span class="state-pill" id="cameraState">インカメラ</span>
        <span class="state-pill" id="mirrorState">ミラー ON</span>
        <span class="state-pill" id="rotateState">回転 0°</span>
      </div>
    </div>
    <div class="button-row">
      <button class="btn" id="cameraSwitchBtn" type="button" disabled>
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3.2 8.8h2.9l1.2-1.9h5.9l1.2 1.9h2.9a1.6 1.6 0 0 1 1.6 1.6v7.4a1.6 1.6 0 0 1-1.6 1.6H3.2a1.6 1.6 0 0 1-1.6-1.6v-7.4a1.6 1.6 0 0 1 1.6-1.6Z"/>
            <circle cx="10.1" cy="14.1" r="3.4"/>
          </svg>
        </span>
        <span id="cameraSwitchLabel">アウトへ</span>
      </button>
      <button class="btn" id="mirrorBtn" type="button"><span class="icon">⇆</span><span>ミラー</span></button>
      <button class="btn" id="rotateBtn" type="button"><span class="icon">↻</span><span>回転</span></button>
      <button class="btn" id="fullscreenBtn" type="button" style="display:none;"><span class="icon" id="fsIcon" aria-hidden="true"></span><span id="fsLabel">全画面</span></button>
      <button class="btn danger" id="stopBtn" type="button" style="display:none;"><span class="icon">■</span><span>停止</span></button>
    </div>
  </div>
</div>
<script>
  const liveVideo       = document.getElementById('liveVideo');
  const canvas          = document.getElementById('playback');
  const ctx             = canvas.getContext('2d');
  const startBtn        = document.getElementById('startBtn');
  const stopBtn         = document.getElementById('stopBtn');
  const overlay         = document.getElementById('overlay');
  const errorMsg        = document.getElementById('errorMsg');
  const delaySlider     = document.getElementById('delaySlider');
  const delayDisplay    = document.getElementById('delayDisplay');
  const delayBadge      = document.getElementById('delayBadge');
  const delayBadgeText  = document.getElementById('delayBadgeText');
  const bufferIndicator = document.getElementById('bufferIndicator');
  const bufferText      = document.getElementById('bufferText');
  const warmupText      = document.getElementById('warmupText');
  const statusText      = document.getElementById('statusText');
  const statusDot       = document.getElementById('statusDot');
  const mirrorBtn       = document.getElementById('mirrorBtn');
  const cameraState     = document.getElementById('cameraState');
  const mirrorState     = document.getElementById('mirrorState');
  const rotateState     = document.getElementById('rotateState');
  const cameraSwitchBtn = document.getElementById('cameraSwitchBtn');
  const cameraSwitchLabel = document.getElementById('cameraSwitchLabel');
  const rotateBtn       = document.getElementById('rotateBtn');
  const fullscreenBtn   = document.getElementById('fullscreenBtn');
  const fsIcon          = document.getElementById('fsIcon');
  const tapHint         = document.getElementById('tapHint');
  const fsLabel         = document.getElementById('fsLabel');

  // 非表示のキャプチャ用キャンバス
  const capCanvas = document.createElement('canvas');
  const capCtx    = capCanvas.getContext('2d');

  let stream = null;
  let captureTimer = null;
  let captureInFlight = false;
  let rafId = null;
  let frameBuffer = []; // [{t: ms, img: HTMLImageElement, url?: string, ready: boolean}]
  let delaySeconds = 10;
  let isRunning = false;
  let mirrored = true;
  let currentFacingMode = 'user';
  let rotationDeg = 0; // 手動回転: 0 / 90 / 180 / 270
  let isUIHidden  = false;
  let captureWidth = 0;
  let captureHeight = 0;
  let lastDrawnFrame = null;

  // 記号（⛶ など）は端末のフォントに無いと豆腐になるため、アイコンはSVGで持つ
  const SVG_EXPAND = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3H4.5A1.5 1.5 0 0 0 3 4.5V9"/><path d="M15 3h4.5A1.5 1.5 0 0 1 21 4.5V9"/><path d="M15 21h4.5a1.5 1.5 0 0 0 1.5-1.5V15"/><path d="M9 21H4.5A1.5 1.5 0 0 1 3 19.5V15"/></svg>';
  const SVG_COLLAPSE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 9H8a1.5 1.5 0 0 0 1.5-1.5V3"/><path d="M20.5 9H16a1.5 1.5 0 0 1-1.5-1.5V3"/><path d="M20.5 15H16a1.5 1.5 0 0 0-1.5 1.5V21"/><path d="M3.5 15H8a1.5 1.5 0 0 1 1.5 1.5V21"/></svg>';
  function setFsIcon(collapsed) { fsIcon.innerHTML = collapsed ? SVG_COLLAPSE : SVG_EXPAND; }
  setFsIcon(false);

  // ── 画面が消えないようにする（対応端末のみ。無ければ黙って諦める）──
  let wakeLock = null;
  async function requestWakeLock() {
    if (!('wakeLock' in navigator) || wakeLock) return;
    try {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } catch (err) {
      wakeLock = null;
    }
  }
  function releaseWakeLock() {
    if (!wakeLock) return;
    try { wakeLock.release(); } catch (err) { /* 解放できなくても実害なし */ }
    wakeLock = null;
  }
  const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const CAPTURE_INTERVAL = IS_IOS ? 125 : 100; // 古い iPad は高fpsより安定優先
  const CAPTURE_MAX_DIM = IS_IOS ? 360 : 480;
  const JPEG_QUALITY = IS_IOS ? 0.52 : 0.62;
  const BUFFER_MARGIN_SECONDS = 2;

  function toggleUI() {
    isUIHidden = !isUIHidden;
    document.body.classList.toggle('ui-hidden', isUIHidden);
    setFsIcon(isUIHidden);
    fsLabel.textContent = isUIHidden ? '戻る' : '全画面';
    if (isUIHidden) {
      // アニメーション再実行のため一旦リセット
      tapHint.style.animation = 'none';
      tapHint.offsetHeight; // reflow
      tapHint.style.animation = '';
    }
    requestAnimationFrame(resizeCanvas);
  }
  fullscreenBtn.addEventListener('click', toggleUI);

  // 全画面中に映像タップでコントロールを戻す
  canvas.addEventListener('click', () => {
    if (isUIHidden) toggleUI();
  });

  // ── キャンバスサイズをコンテナに合わせる ──
  function resizeCanvas() {
    canvas.width  = canvas.offsetWidth  || canvas.clientWidth  || 1;
    canvas.height = canvas.offsetHeight || canvas.clientHeight || 1;
  }
  window.addEventListener('resize', resizeCanvas);

  // ── 遅延スライダー ──
  delaySlider.addEventListener('input', (e) => {
    delaySeconds = parseInt(e.target.value, 10);
    delayDisplay.textContent = delaySeconds;
    delayBadgeText.textContent = `${delaySeconds}秒前の映像`;
    updateControlState();
  });

  // ── ミラー切替 ──
  mirrorBtn.addEventListener('click', () => {
    mirrored = !mirrored;
    updateControlState();
  });

  // ── 回転ボタン（上下逆などを手動補正）──
  rotateBtn.addEventListener('click', () => {
    rotationDeg = (rotationDeg + 90) % 360;
    updateControlState();
  });


  function updateControlState() {
    const isFront = currentFacingMode === 'user';
    cameraState.textContent = isFront ? 'インカメラ' : 'アウトカメラ';
    mirrorState.textContent = mirrored ? 'ミラー ON' : 'ミラー OFF';
    rotateState.textContent = `回転 ${rotationDeg}°`;
    // ボタンには「今どちらか」ではなく「押すとどうなるか」を出す
    cameraSwitchLabel.textContent = isFront ? 'アウトへ' : 'インへ';
    cameraSwitchBtn.setAttribute('aria-label',
      isFront ? 'アウトカメラに切り替える' : 'インカメラに切り替える');
  }
  updateControlState();
  // ── カメラ切替 ──
  cameraSwitchBtn.addEventListener('click', async () => {
    if (!isRunning) return;
    const previousFacingMode = currentFacingMode;
    const nextFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';
    cameraSwitchBtn.disabled = true;
    try {
      const nextStream = await openCamera(nextFacingMode);
      currentFacingMode = nextFacingMode;
      await useStream(nextStream);
      // インは鏡像、アウトは見たままが自然。切替のたびに既定へ戻す（手動での再変更は可）
      mirrored = (currentFacingMode === 'user');
      updateControlState();
      errorMsg.textContent = '';
    } catch (err) {
      currentFacingMode = previousFacingMode;
      errorMsg.textContent = cameraErrorMessage(err);
    } finally {
      cameraSwitchBtn.disabled = false;
    }
  });

  startBtn.addEventListener('click', startCamera);

  // 停止時・カメラを失ったときの共通後始末
  function resetToIdle(message) {
    stopCapture();
    releaseWakeLock();
    // UI非表示モードを解除してから停止
    if (isUIHidden) { isUIHidden = false; document.body.classList.remove('ui-hidden'); setFsIcon(false); fsLabel.textContent = '全画面'; }
    overlay.classList.remove('hidden');
    stopBtn.style.display = 'none';
    delayBadge.style.display = 'none';
    bufferIndicator.style.display = 'none';
    warmupText.style.display = 'none';
    fullscreenBtn.style.display = 'none';
    cameraSwitchBtn.disabled = true;
    statusText.textContent = '待機中';
    statusDot.classList.remove('live');
    errorMsg.textContent = message || '';
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }

  stopBtn.addEventListener('click', () => resetToIdle(''));

  // ── カメラ起動 ──
  async function startCamera() {
    errorMsg.textContent = '';
    try {
      const nextStream = await openCamera(currentFacingMode);
      await useStream(nextStream);

      overlay.classList.add('hidden');
      stopBtn.style.display = 'flex';
      delayBadge.style.display = 'flex';
      bufferIndicator.style.display = 'block';
      warmupText.style.display = 'block';
      fullscreenBtn.style.display = 'flex';
      cameraSwitchBtn.disabled = false;
      delayBadgeText.textContent = `${delaySeconds}秒前の映像`;
      updateControlState();
      statusText.textContent = '準備中';
      statusDot.classList.add('live');
      isRunning = true;
      requestWakeLock();
    } catch (err) {
      errorMsg.textContent = cameraErrorMessage(err);
    }
  }

  async function openCamera(facingMode) {
    return navigator.mediaDevices.getUserMedia({
      video: {
        facingMode,
        width: { ideal: IS_IOS ? 960 : 1280 },
        height: { ideal: IS_IOS ? 540 : 720 }
      },
      audio: false
    });
  }

  async function useStream(nextStream) {
    stopCapture({ keepStream: true });
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = nextStream;
    liveVideo.srcObject = stream;
    // カメラが外部要因（他アプリ・権限変更）で止まったら気づけるようにする
    const videoTrack = stream.getVideoTracks()[0];
    if (videoTrack) {
      videoTrack.addEventListener('ended', () => {
        if (isRunning) resetToIdle('カメラが停止しました。もう一度「カメラを開始」を押してください。');
      });
    }
    await liveVideo.play();

    isRunning = true;
    frameBuffer = [];
    lastDrawnFrame = null;
    captureWidth = 0;
    captureHeight = 0;
    resizeCanvas();
    scheduleCapture(0);
    rafId = requestAnimationFrame(drawLoop);
  }

  function cameraErrorMessage(err) {
    if (err && err.name === 'NotAllowedError') return 'カメラへのアクセスが拒否されました。ブラウザ設定で許可してください。';
    if (err && err.name === 'NotFoundError') return 'カメラが見つかりませんでした。';
    if (err && err.name === 'OverconstrainedError') return 'この端末では選択したカメラを使えません。';
    if (err && err.message) return err.message;
    return 'カメラを起動できませんでした。';
  }

  // ── フレームキャプチャ ──
  function scheduleCapture(delay) {
    if (!isRunning || !stream) return;
    captureTimer = setTimeout(captureFrame, delay);
  }

  function captureFrame() {
    if (!isRunning || !stream) return;
    if (captureInFlight) {
      scheduleCapture(CAPTURE_INTERVAL);
      return;
    }

    const vw = liveVideo.videoWidth;
    const vh = liveVideo.videoHeight;
    // videoWidth/videoHeight が確定するまで待つ（iOS では遅れることがある）
    if (!vw || !vh) {
      scheduleCapture(CAPTURE_INTERVAL);
      return;
    }

    const maxDim = CAPTURE_MAX_DIM;
    let nextWidth;
    let nextHeight;
    if (vw >= vh) {
      nextWidth  = maxDim;
      nextHeight = Math.round(maxDim * vh / vw);
    } else {
      nextWidth  = Math.round(maxDim * vw / vh);
      nextHeight = maxDim;
    }
    if (nextWidth !== captureWidth || nextHeight !== captureHeight) {
      captureWidth = nextWidth;
      captureHeight = nextHeight;
      capCanvas.width = captureWidth;
      capCanvas.height = captureHeight;
    }

    const capturedAt = performance.now();
    capCtx.drawImage(liveVideo, 0, 0, captureWidth, captureHeight);
    captureInFlight = true;

    if (capCanvas.toBlob) {
      capCanvas.toBlob((blob) => {
        captureInFlight = false;
        if (blob && isRunning) addBlobFrame(capturedAt, blob);
        trimBuffer();
        scheduleCapture(CAPTURE_INTERVAL);
      }, 'image/jpeg', JPEG_QUALITY);
    } else {
      const img = new Image();
      const frame = { t: capturedAt, img, ready: false };
      img.onload = () => { frame.ready = true; };
      img.src = capCanvas.toDataURL('image/jpeg', JPEG_QUALITY);
      frameBuffer.push(frame);
      captureInFlight = false;
      trimBuffer();
      scheduleCapture(CAPTURE_INTERVAL);
    }
  }

  function addBlobFrame(t, blob) {
    const url = URL.createObjectURL(blob);
    const img = new Image();
    const frame = { t, img, url, ready: false };
    img.onload = () => { frame.ready = true; };
    img.onerror = () => releaseFrame(frame);
    img.src = url;
    frameBuffer.push(frame);
  }

  function releaseFrame(frame) {
    if (frame && frame.url) {
      URL.revokeObjectURL(frame.url);
      frame.url = '';
    }
  }

  function trimBuffer() {
    const cutoff = performance.now() - (delaySeconds + BUFFER_MARGIN_SECONDS) * 1000;
    while (frameBuffer.length > 0 && frameBuffer[0].t < cutoff) {
      releaseFrame(frameBuffer.shift());
    }
    const hardMax = Math.ceil((delaySeconds + BUFFER_MARGIN_SECONDS + 1) * 1000 / CAPTURE_INTERVAL);
    while (frameBuffer.length > hardMax) {
      releaseFrame(frameBuffer.shift());
    }
  }

  // ── 描画ループ ──
  function drawLoop() {
    rafId = requestAnimationFrame(drawLoop);
    if (!isRunning || frameBuffer.length === 0) return;

    const bufferedSeconds = (frameBuffer[frameBuffer.length - 1].t - frameBuffer[0].t) / 1000;
    bufferText.textContent = bufferedSeconds.toFixed(1) + 's';
    if (bufferedSeconds < delaySeconds) {
      warmupText.style.display = 'block';
      warmupText.querySelector('strong').textContent = `${bufferedSeconds.toFixed(1)}s / ${delaySeconds}s`;
      statusText.textContent = '準備中';
      return;
    }

    warmupText.style.display = 'none';
    statusText.textContent = '撮影中';

    const targetTime = performance.now() - delaySeconds * 1000;
    let frame = null;
    for (let i = frameBuffer.length - 1; i >= 0; i--) {
      if (frameBuffer[i].t <= targetTime && frameBuffer[i].ready) { frame = frameBuffer[i]; break; }
    }
    if (!frame) frame = lastDrawnFrame;
    if (!frame || !frame.img.complete || !frame.img.naturalWidth) return;
    lastDrawnFrame = frame;

    const cw = canvas.width;
    const ch = canvas.height;
    if (!cw || !ch) return;

    const fw = frame.img.naturalWidth;
    const fh = frame.img.naturalHeight;
    const isRot90 = (rotationDeg === 90 || rotationDeg === 270);

    // 90°/270° 回転時はキャンバスへのフィットで幅・高さが入れ替わる
    const fitW = isRot90 ? fh : fw;
    const fitH = isRot90 ? fw : fh;
    const scale = Math.min(cw / fitW, ch / fitH);

    ctx.clearRect(0, 0, cw, ch);
    ctx.save();
    ctx.translate(cw / 2, ch / 2);
    // ① まず回転（方向補正）、② 次にミラー（左右反転）の順で適用
    if (rotationDeg) ctx.rotate(rotationDeg * Math.PI / 180);
    if (mirrored)    ctx.scale(-1, 1);
    ctx.drawImage(frame.img, -fw * scale / 2, -fh * scale / 2, fw * scale, fh * scale);
    ctx.restore();
  }

  // ── 停止・クリーンアップ ──
  function stopCapture(options = {}) {
    isRunning = false;
    if (captureTimer) { clearTimeout(captureTimer); captureTimer = null; }
    captureInFlight = false;
    if (rafId)           { cancelAnimationFrame(rafId);    rafId = null; }
    if (stream && !options.keepStream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    if (!options.keepStream) liveVideo.srcObject = null;
    frameBuffer.forEach(releaseFrame);
    frameBuffer = [];
    lastDrawnFrame = null;
  }

  // ── 画面ロックやアプリ切替から戻ったときの復帰 ──
  // iOSは非表示のあいだカメラを止めるため、戻ったら再生を促し、古いフレームは捨てて溜め直す
  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState !== 'visible' || !isRunning) return;
    requestWakeLock();
    const videoTrack = stream && stream.getVideoTracks()[0];
    if (!videoTrack || videoTrack.readyState !== 'live') {
      try {
        const nextStream = await openCamera(currentFacingMode);
        await useStream(nextStream);
        errorMsg.textContent = '';
      } catch (err) {
        resetToIdle(cameraErrorMessage(err));
      }
      return;
    }
    try { await liveVideo.play(); } catch (err) { /* 再生が拒否されても次の復帰で拾う */ }
    frameBuffer.forEach(releaseFrame);
    frameBuffer = [];
    lastDrawnFrame = null;
    statusText.textContent = '準備中';
    warmupText.style.display = 'block';
  });

  // iOSでは beforeunload が発火しないことがあるため pagehide も見る
  window.addEventListener('pagehide', () => { releaseWakeLock(); stopCapture(); });
  window.addEventListener('beforeunload', stopCapture);
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js')
        .then((reg) => console.log('SW registered:', reg.scope))
        .catch((err) => console.warn('SW registration failed:', err));
    });
  }
</script>
</body>
